name: Aggiorna dati FIPAV e pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Orari in UTC, coprono sia l'ora solare (UTC+1) sia l'ora legale (UTC+2) di Roma.
    # Sabato: finestra 17:30-21:30 ora italiana (partite dalle 15:30 alle 19:30, durata fino a 2 ore)
    - cron: "33 15-20 * * 6"
    # Domenica: finestra 18:00-20:00 ora italiana (partite dalle 16:00 alle 18:00)
    - cron: "33 16-19 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica calendario e classifica FIPAV
        run: |
          set -e
          for f in calendario classifica; do
            curl -fsS --retry 3 --retry-delay 10 -m 90 -A "Mozilla/5.0 (compatible; arzano-b2-site/1.0; +https://github.com/frandes-dicea/arzano-b2)" -o /tmp/$f.json \
              https://media.myvolley.net/public/json/2026/B2/F/H/$f.json
          done

      - name: Rigenera data.json
        run: python3 scripts/gen.py /tmp/calendario.json /tmp/classifica.json data.json

      - name: Salva data.json se è cambiato
        run: |
          if git diff --quiet -- data.json; then
            echo "Dati invariati"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Aggiorna risultati e classifica dai dati FIPAV"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
